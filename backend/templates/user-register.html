<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Minutes - User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #14213d;
            --navy-2: #1c2c52;
            --amber: #f2a71b;
            --amber-dark: #d88f0a;
            --teal: #0f7173;
            --paper: #f5f6f8;
            --card: #ffffff;
            --line: #e3e6ec;
            --muted: #64748b;
        }
        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .logo { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.01em; }

        body {
            background: var(--navy);
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px),
                linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
            background-size: 26px 26px, cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body.dark-mode {
            background: #0b1220;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(135deg, #0b1220 0%, #101a2e 100%);
            background-size: 26px 26px, cover;
        }
        .register-wrapper { width: 100%; max-width: 480px; }
        .register-card {
            background: var(--card); border-radius: 18px; padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            border: 1px solid var(--line);
        }
        body.dark-mode .register-card { background: #101a2e; border-color: #1e293b; }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-header .logo {
            font-size: 26px; font-weight: 700; color: var(--navy); text-decoration: none;
        }
        .register-header .logo i { color: var(--amber-dark); }
        body.dark-mode .register-header .logo { color: #e2e8f0; }
        .register-header h2 { font-weight: 700; font-size: 22px; margin-top: 8px; color: var(--navy); }
        body.dark-mode .register-header h2 { color: #e2e8f0; }
        .register-header p { color: var(--muted); font-size: 14px; }
        body.dark-mode .register-header p { color: #94a3b8; }
        .badge-user {
            background: #eef1f6; color: var(--navy); padding: 4px 12px;
            border-radius: 6px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.04em;
            font-family: 'IBM Plex Mono', monospace;
        }
        body.dark-mode .badge-user { background: #1c2c52; color: #9db4e6; }
        .form-label { font-weight: 600; font-size: 13px; color: var(--navy); }
        body.dark-mode .form-label { color: #e2e8f0; }
        .form-control {
            border-radius: 8px; padding: 12px 16px; border: 1.5px solid var(--line);
            font-size: 14px; transition: all 0.2s;
        }
        body.dark-mode .form-control { background: #0b1220; border-color: #263252; color: #e2e8f0; }
        .form-control:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(20,33,61,0.1); }
        body.dark-mode .form-control:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(242,167,27,0.18); }
        .btn-register {
            background: var(--navy); color: var(--amber); border: none; padding: 14px;
            border-radius: 10px; font-weight: 700; font-size: 16px;
            transition: all 0.2s; width: 100%; cursor: pointer;
        }
        .btn-register:hover { background: var(--navy-2); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(20,33,61,0.3); }
        .btn-login {
            background: var(--teal); color: white; border: none; padding: 14px;
            border-radius: 10px; font-weight: 700; font-size: 16px;
            transition: all 0.2s; width: 100%; cursor: pointer;
        }
        .btn-login:hover { background: #0b5c5e; transform: translateY(-2px); }
        .password-requirements { font-size: 12px; color: var(--muted); margin-top: 4px; }
        body.dark-mode .password-requirements { color: #94a3b8; }
        .back-link { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; }
        .back-link:hover { color: var(--navy); }
        body.dark-mode .back-link { color: #94a3b8; }
        body.dark-mode .back-link:hover { color: var(--amber); }
        .alert-success { background: #e2f3f2; color: var(--teal); border: none; }
        body.dark-mode .alert-success { background: #0c3536; color: #5fd6d3; }
        .text-success { color: var(--teal) !important; }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <div class="register-header">
                <a href="/" class="logo"><i class="bi bi-clock-history"></i> 30 Minutes</a>
                <h2>User Registration</h2>
                <p>Create your account to book services</p>
                <span class="badge-user"><i class="bi bi-person"></i> User</span>
            </div>

            <!-- Registration Form -->
            <div id="registerForm">
                <form id="userForm">
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="John" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="mb-3 mt-2">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="98765 43210" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="8+ chars, 1 upper, 1 lower, 1 number, 1 special" required>
                        <div class="password-requirements">
                            <span id="reqLength"><i class="bi bi-circle"></i> At least 8 characters</span><br>
                            <span id="reqUpper"><i class="bi bi-circle"></i> 1 uppercase letter</span><br>
                            <span id="reqLower"><i class="bi bi-circle"></i> 1 lowercase letter</span><br>
                            <span id="reqNumber"><i class="bi bi-circle"></i> 1 number</span><br>
                            <span id="reqSpecial"><i class="bi bi-circle"></i> 1 special character (!@#$%^&*)</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
                    </div>
                    <button type="button" class="btn-register" id="registerBtn">
                        <i class="bi bi-person-plus"></i> Register
                    </button>
                </form>
            </div>

            <!-- Success Message -->
            <div id="successMessage" style="display:none;">
                <div class="text-center py-3">
                    <div class="success-icon"><i class="bi bi-check-circle-fill text-success" style="font-size:64px;"></i></div>
                    <h3 class="mt-3">Registration Successful! 🎉</h3>
                    <p class="text-muted" id="successMsg">Welcome to 30 Minutes!</p>
                    <div class="alert alert-success mt-3">
                        <i class="bi bi-check-circle"></i> Your account has been created.
                    </div>
                    <a href="/" class="btn-register mt-3 text-center" style="text-decoration:none; display:inline-block;">
                        <i class="bi bi-house"></i> Go to Home
                    </a>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="/register/" class="back-link"><i class="bi bi-arrow-left"></i> Back to Registration Options</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerBtn').addEventListener('click', function() {
            var firstName = document.getElementById('firstName').value.trim();
            var lastName = document.getElementById('lastName').value.trim();
            var email = document.getElementById('email').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!firstName || !lastName || !email || !phone || !password || !confirmPassword) {
                alert('Please fill in all required fields!');
                return;
            }
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            if (password.length < 8) {
                alert('Password must be at least 8 characters!');
                return;
            }
            
            registerUser(firstName, lastName, email, phone, password);
        });

        async function registerUser(firstName, lastName, email, phone, password) {
            try {
                var response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: phone,
                        password: password,
                        type: 'customer'
                    })
                });

                var result = await response.json();
                
                if (response.status === 201) {
                    localStorage.setItem('access_token', result.access_token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('successMsg').textContent = 'Welcome ' + result.user.first_name + '! Your account is ready.';
                    
                    setTimeout(function() { 
                        window.location.href = '/'; 
                    }, 2000);
                } else {
                    alert('Registration failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Registration failed. Please try again.');
            }
        }

        // Password validation - real time
        document.getElementById('password').addEventListener('input', function() {
            var password = this.value;
            
            document.getElementById('reqLength').innerHTML = 
                '<i class="bi bi-' + (password.length >= 8 ? 'check-circle-fill text-success' : 'circle') + '"></i> At least 8 characters';
            document.getElementById('reqUpper').innerHTML = 
                '<i class="bi bi-' + (/[A-Z]/.test(password) ? 'check-circle-fill text-success' : 'circle') + '"></i> 1 uppercase letter';
            document.getElementById('reqLower').innerHTML = 
                '<i class="bi bi-' + (/[a-z]/.test(password) ? 'check-circle-fill text-success' : 'circle') + '"></i> 1 lowercase letter';
            document.getElementById('reqNumber').innerHTML = 
                '<i class="bi bi-' + (/[0-9]/.test(password) ? 'check-circle-fill text-success' : 'circle') + '"></i> 1 number';
            document.getElementById('reqSpecial').innerHTML = 
                '<i class="bi bi-' + (/[!@#$%^&*(),.?":{}|<>]/.test(password) ? 'check-circle-fill text-success' : 'circle') + '"></i> 1 special character (!@#$%^&*)';
        });

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
